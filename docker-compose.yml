name: oficina-fase1

services:
  app:
    image: oficina-fase1-app
    build: .
    env_file: .env
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:${APP_PORT:-8081}
      DB_CONNECTION: mysql
      DB_URL: ""
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-oficina}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-oficina}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-oficina_local}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    volumes:
      - app-storage:/var/www/html/storage
      - ./build:/var/www/html/build
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  tests:
    profiles: [quality]
    image: oficina-fase1-app
    env_file: .env
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_URL: ""
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: oficina_testing
      DB_USERNAME: ${DOCKER_DB_USERNAME:-oficina}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-oficina_local}
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: "null"
    volumes:
      - ./build:/var/www/html/build
    depends_on:
      mysql:
        condition: service_healthy
    command: ["php", "artisan", "test", "--compact", "--no-ansi", "--fail-on-warning"]

  mysql:
    image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-oficina}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-oficina}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-oficina_local}
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD:-root_local}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/10-testing.sh:/docker-entrypoint-initdb.d/10-testing.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
  app-storage:
